<style>
  :root { --ink: #22275E; --plum: #7C4DDB; --yellow: #FFD84D; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
    background: radial-gradient(ellipse at 50% 30%, #FFF3B8 0%, var(--yellow) 60%); color: var(--ink); font: 17px/1.5 system-ui, sans-serif; text-align: center; }
  main { max-width: 420px; width: 100%; }
  img { width: 132px; height: 132px; border-radius: 32px; box-shadow: 0 14px 30px rgba(80,55,20,.25); }
  h1 { font: 700 34px/1.15 Georgia, 'Times New Roman', serif; margin: 22px 0 8px; letter-spacing: -.5px; }
  p { margin: 0 0 26px; color: #3D3A5C; }
  .btn { display: block; background: var(--plum); color: #fff; text-decoration: none; font-weight: 800; font-size: 21px;
    padding: 18px 24px 20px; border-radius: 999px; box-shadow: 0 12px 26px rgba(43,37,80,.25); }
  .btn:active { transform: translateY(2px); }
  small { display: block; margin-top: 18px; color: #5A5375; }
  small a { color: inherit; }
</style>
</head>

<main>
  <img src="icon.png" alt="Numzies app icon">

  <a class="btn" href="https://play.google.com/store/apps/details?id=com.cesaryounes.mathworlds">Get Numzies on Google Play</a>
